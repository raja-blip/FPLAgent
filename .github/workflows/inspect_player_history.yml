name: Inspect player history

on:
  workflow_dispatch:
    inputs:
      player_name:
        description: "Player name to look up (e.g. Haaland)"
        type: string
        default: "Haaland"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/inspect_player_history.py "${{ inputs.player_name }}"
