name: Test FPL connection

# Manual trigger only — this is a one-off diagnostic while you're setting
# things up, not part of the scheduled agent runs we'll add later.
on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: DNS and connectivity diagnostic
        continue-on-error: true
        run: |
          echo "--- DNS lookup: account.premierleague.com ---"
          getent hosts account.premierleague.com || echo "DNS lookup FAILED"
          echo "--- DNS lookup: fantasy.premierleague.com ---"
          getent hosts fantasy.premierleague.com || echo "DNS lookup FAILED"

      - run: pip install -r requirements.txt

      - run: python scripts/test_login.py
        env:
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
