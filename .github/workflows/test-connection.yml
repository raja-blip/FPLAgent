name: Test FPL connection

# Manual trigger only — this is a one-off diagnostic while you're setting
# things up, not part of the scheduled agent runs we'll add later.
on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: DNS and connectivity diagnostic
        continue-on-error: true
        run: |
          echo "--- DNS lookup (default resolver): users.premierleague.com ---"
          getent hosts users.premierleague.com || echo "DNS lookup FAILED"
          echo "--- DNS lookup (default resolver): fantasy.premierleague.com ---"
          getent hosts fantasy.premierleague.com || echo "DNS lookup FAILED"
          echo "--- DNS lookup (Google 8.8.8.8): users.premierleague.com ---"
          nslookup users.premierleague.com 8.8.8.8 || echo "DNS lookup FAILED via 8.8.8.8"
          echo "--- DNS lookup (Cloudflare 1.1.1.1): users.premierleague.com ---"
          nslookup users.premierleague.com 1.1.1.1 || echo "DNS lookup FAILED via 1.1.1.1"
          echo "--- HTTPS connectivity test ---"
          curl -sv --max-time 10 https://users.premierleague.com/ -o /dev/null 2>&1 | tail -20 || echo "Connection FAILED"

      - run: pip install -r requirements.txt

      - run: python scripts/test_login.py
        env:
          FPL_EMAIL: ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD: ${{ secrets.FPL_PASSWORD }}
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
