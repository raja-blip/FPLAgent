name: Compare players

on:
  workflow_dispatch:
    inputs:
      player1:
        description: "First player name"
        type: string
        default: "Haaland"
      player2:
        description: "Second player name"
        type: string
        default: "Dowman"

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/compare_players.py "${{ inputs.player1 }}" "${{ inputs.player2 }}"
